name = "transit-relay"
main = "transit-relay.js"
compatibility_date = "2025-01-01"

# Watchdog probe — every 5 min writes upstream health to TT_STATE_KV.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGINS = "http://localhost:5173, https://charlesdvaught-hash.github.io, https://timetransit-site.charlesdvaught-34c.workers.dev"
LLM_PROVIDERS = "groq,gemini"

[[kv_namespaces]]
binding = "TT_STATE_KV"
id = "446d050b6f8a42b1acd7d8ca00214f1c"
